[package]
name = "niriksh"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
chrono = "0.4.38"
crossterm = "0.29.0"
directories = "6.0.0"
ratatui = "0.30.1"
reqwest = { version = "0.13.4", features = ["json"] }
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = ["full"] }

[build-dependencies]
ureq = "3.3.0"
